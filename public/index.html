<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZyroMeet - Random Video Chat</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>ZyroMeet</h1>
      <p>Connect with random strangers</p>
      <div class="online-status">
        <span class="online-dot"></span>
        <span id="onlineCounter">0</span> online
      </div>
    </header>

    <div class="main-content">
      <div class="video-section">
        <div class="video-container">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="video-label">Stranger</div>
        </div>
        <div class="video-container">
          <video id="localVideo" autoplay muted playsinline></video>
          <div class="video-label">You</div>
        </div>
      </div>

      <div class="chat-section">
        <div id="chatBox" class="chat-box"></div>
        <div class="chat-input-container">
          <input type="text" id="messageInput" placeholder="Type a message..." disabled>
          <button id="sendBtn" disabled>Send</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn-primary">Start</button>
      <button id="muteBtn" class="btn-secondary btn-icon-label" disabled aria-label="Mute microphone">
        <svg class="mic-icon mic-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <path d="M12 19v3"/>
        </svg>
        <svg class="mic-icon mic-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m2 2 20 20"/>
          <path d="M9 9v3a3 3 0 0 0 5.12 2.12"/>
          <path d="M15 9.34V5a3 3 0 0 0-5.94-.6"/>
          <path d="M17 16.95A7 7 0 0 1 5 12v-2"/>
          <path d="M19 10v2a7 7 0 0 1-.11 1.23"/>
          <path d="M12 19v3"/>
        </svg>
        <span>Mute</span>
      </button>
      <button id="skipBtn" class="btn-secondary" disabled>Skip</button>
      <button id="stopBtn" class="btn-danger" disabled>Stop</button>
    </div>

    <div id="status" class="status"></div>
    
    <footer>
      Made with <svg width="16" height="16" viewBox="0 0 24 24" fill="oklch(0.55 0.18 25)" style="display: inline-block; vertical-align: middle; margin: 0 2px;" aria-label="love"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> in India
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.2/dist/nsfwjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
